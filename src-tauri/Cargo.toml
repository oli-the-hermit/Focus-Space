[package]
name = "focus-space"
version = "1.1.0"
description = "Focus Space desktop app"
authors = ["San Milano"]
license-file = "../LICENSE"
repository = "https://github.com/oli-the-hermit/Focus-Space"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Already pulled in by Tauri (its async runtime); used for the alert timer.
tokio = { version = "1", features = ["time"] }
# Local backend (port of server/): SQLite compiled in, so end users need nothing installed.
rusqlite = { version = "0.32", features = ["bundled"] }
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
subtle = "2.6"
tauri-plugin-updater = "2"

# PBKDF2 runs 310k iterations per login; optimize even dev/test builds so logging
# in (and `cargo test`) doesn't take seconds per hash. pbkdf2_hmac::<Sha256> is
# generic, so it is compiled in this crate, which needs its own override too.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.focus-space]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
